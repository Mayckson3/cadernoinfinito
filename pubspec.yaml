name: caderno_infinito
description: Caderno infinito para Android e Windows com login Google e sincronização de arquivos no Drive.
publish_to: none
version: 1.0.8+30

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.3.0
  path_provider: ^2.1.5
  google_sign_in: ^7.2.0
  url_launcher: ^6.3.1
  crypto: ^3.0.6
  flutter_secure_storage: ^9.2.4
  file_picker: ^10.3.3
  pdfx: ^2.9.2
  pdf: ^3.11.3
  printing: ^5.14.2
  image: ^4.5.4
  ffi: ^2.1.3
  uuid: ^4.5.1
  shared_preferences: ^2.5.3

flutter:
  uses-material-design: true

dev_dependencies:
  flutter_test:
    sdk: flutter
